name: Validate Vue and Workers
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: easy-eat-front/package-lock.json
      - run: npm --prefix easy-eat-front ci
      - run: npm --prefix easy-eat-front run lint
      - run: npm --prefix easy-eat-front run type-check:e2e
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
        working-directory: easy-eat-front
      - run: npm --prefix easy-eat-front run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: easy-eat-front/test-results
      - run: docker build -t easy-eat-preview .
